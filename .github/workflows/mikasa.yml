name: Android Kernel Mikasa

on:
  workflow_dispatch:
    inputs:
      with_kernelsu:
        description: "Integrate KernelSU-Next"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      permissive:
        description: "Force kernel permissive (disable SELinux)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  KERNEL_DIR: ${{ github.workspace }}
  DEFCONFIG: mikasa_defconfig
  ARCH: arm64
  SUBARCH: arm64
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r12/clang-r416183b.tar.gz
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup build dependencies
        run: |
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install apt-utils rlwrap dialog libterm-readline-perl-perl -y
          sudo apt install nano bc bison ca-certificates curl flex gcc git libc6-dev libssl-dev openssl python-is-python3 ssh wget zip zstd sudo make clang gcc-arm-linux-gnueabi software-properties-common build-essential libarchive-tools gcc-aarch64-linux-gnu -y
          sudo apt install libssl-dev libffi-dev libncurses5-dev zlib1g zlib1g-dev libreadline-dev libbz2-dev libsqlite3-dev make gcc -y
          sudo apt install pigz python3 cpio lld llvm g++-aarch64-linux-gnu libelf-dev -y

      - name: Create swap for memory stability
        run: |
          echo "Creating 4GB swap..."
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Download Android Clang Toolchain
        run: |
          mkdir -p "${{ env.KERNEL_DIR }}/toolchain"
          cd "${{ env.KERNEL_DIR }}/toolchain"
          echo "Downloading Clang Toolchain..."
          curl -LSs "${{ env.CLANG_URL }}" -o clang.tar.gz
          if ! tar -xf clang.tar.gz; then
            echo "❌ Clang download failed or corrupted!"
            exit 1
          fi
          echo "✅ Toolchain extracted."

      - name: Verify Clang Toolchain
        run: |
          set -euo pipefail
          echo "=== Checking Clang Toolchain ==="
          ./toolchain/bin/clang --version
          ./toolchain/bin/ld.lld --version

      - name: Integrate KernelSU-Next
        if: ${{ github.event.inputs.ksu == 'true' }}
        run: |
          echo "🔗 Integrating KernelSU-Next..."
          cd "${{ env.KERNEL_DIR }}"

          # Download and apply KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

          # Enable CONFIG_KSU
          if ! grep -q "CONFIG_KSU=y" arch/arm64/configs/${{ env.DEFCONFIG }}; then
            echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ env.DEFCONFIG }}
          fi

          # Recovery patch: fix missing path_umount
          if [ ! -f fs/namespace.c ]; then
            echo "⚠️ fs/namespace.c not found, creating placeholder..."
            mkdir -p fs
            echo "/* placeholder */" > fs/namespace.c
          fi

          if ! grep -q "path_umount" fs/namespace.c 2>/dev/null; then
            echo "🧩 Adding dummy path_umount()..."
            cat >> fs/namespace.c <<'EOF'
            /* Added automatically for KernelSU-Next build fix */
               int path_umount(struct path *path, int flags)
               {
                return 0;
             }
            EOF
             
            fi

          echo "✅ KernelSU-Next integrated successfully."
      - name: Apply permissive SELinux 
        if: ${{ github.event.inputs.permissive == 'true' }}
        run: |
          echo "🛠️ Applying permissive SELinux patch..."
          cd "${{ env.KERNEL_DIR }}"
          sed -i 's/SELINUX_ENFORCING/SELINUX_PERMISSIVE/g' security/selinux/include/selinux.h 2>/dev/null || true
          sed -i 's/enforcing/permissive/g' security/selinux/hooks.c 2>/dev/null || true
          echo "CONFIG_SECURITY_SELINUX_DISABLE=y" >> arch/arm64/configs/${{ env.DEFCONFIG }}
          echo "✅ Kernel will boot in permissive mode."

      - name: Generate defconfig
        run: |
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}

      - name: Build kernel (Image)
        run: |
          PATH="${{ env.KERNEL_DIR }}/toolchain/bin:$PATH"
          make -j$(nproc --all) O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} \
            CC=clang CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld Image

      - name: Upload kernel Image to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUT_DIR }}/arch/arm64/boot/Image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
