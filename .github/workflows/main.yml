name: Build Android kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # adjust these as needed
  KERNEL_DIR: ${{ github.workspace }}        # path to kernel source (repo root by default)
  TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain
  CLANG_TARBALL_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r12/clang-r416183b.tar.gz
  DEFCONFIG: mikasa_defconfig
  ARCH: arm64
  OUTDIR: ${{ github.workspace }}/out

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host deps
        run: |
          sudo apt update -y && sudo apt upgrade -y && sudo apt install apt-utils rlwrap dialog -y && sudo apt install libterm-readline-perl-perl -y && sudo apt install nano bc bison ca-certificates curl flex gcc git libc6-dev libssl-dev openssl python-is-python3 ssh wget zip zstd sudo make clang gcc-arm-linux-gnueabi software-properties-common build-essential libarchive-tools gcc-aarch64-linux-gnu -y && sudo apt install build-essential -y && sudo apt install libssl-dev libffi-dev libncurses5-dev zlib1g zlib1g-dev libreadline-dev libbz2-dev libsqlite3-dev make gcc -y && sudo apt install pigz -y && sudo apt install python3 -y && sudo apt install cpio -y && sudo apt install lld -y && sudo apt install llvm -y && sudo apt-get install g++-aarch64-linux-gnu -y && sudo apt install libelf-dev -y 
      - name: Download + extract AOSP Clang (r416183b)
        run: |
          mkdir -p "${{ env.TOOLCHAIN_DIR }}"
          echo "Downloading clang from: $CLANG_TARBALL_URL"
          wget -qO clang.tar.gz "$CLANG_TARBALL_URL"
          tar -xzf clang.tar.gz -C "${{ env.TOOLCHAIN_DIR }}" --strip-components=1
          rm clang.tar.gz
          ls -lah "${{ env.TOOLCHAIN_DIR }}" | sed -n '1,20p'

    - name: Prepare environment and build
        run: |
          set -euo pipefail
          cd "${{ env.KERNEL_DIR }}"

          mkdir -p "${OUTDIR}"

          # ensure AOSP clang is first in PATH
          export PATH="${{ env.TOOLCHAIN_DIR }}/bin:${PATH}"

          # set environment
          export ARCH=${{ env.ARCH }}
          export DEFCONFIG=${{ env.DEFCONFIG }}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LOCALVERSION=-mikasa
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1

          echo "=== Using Clang from toolchain dir ==="
          which clang
          clang --version | head -n3

          echo "=== Using ld.lld from toolchain dir ==="
          which ld.lld || true

          echo "=== Building defconfig ==="
          make O="${OUTDIR}" ${DEFCONFIG}

          echo "=== Building kernel Image ==="
          make -C . O="${OUTDIR}" -j$(nproc --all) \
            ARCH=${ARCH} \
            CC=clang \
            LD=ld.lld \
            LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            Image

          # Copy output
          mkdir -p "${{ github.workspace }}/release"
          cp "${OUTDIR}/arch/arm64/boot/Image" "${{ github.workspace }}/release/Image-${GITHUB_RUN_NUMBER}.img"

      - name: List release files
        run: ls -lah "${{ github.workspace }}/release"

      - name: Create GitHub Release and upload Image
        # softprops/action-gh-release will create a release and upload files declared in `files`
        uses: softprops/action-gh-release@v1
        with:
          name: "kernel-image-${{ github.run_number }}"
          tag_name: "kernel-image-${{ github.run_number }}"
          body: "Automated kernel build (clang-r416183b) - Image for ${DEFCONFIG}"
          files: release/*.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact (fallback / for Actions UI)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: release/*.img
