name: Build Mikasa Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write  # diperlukan untuk membuat GitHub Release

env:
  KERNEL_DIR: ${{ github.workspace }}
  TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain
  CLANG_TARBALL_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r12/clang-r416183b.tar.gz
  DEFCONFIG: mikasa_defconfig
  ARCH: arm64
  OUTDIR: ${{ github.workspace }}/out
  

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install full dependencies
        run: |
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install apt-utils rlwrap dialog -y
          sudo apt install libterm-readline-perl-perl -y
          sudo apt install nano bc bison ca-certificates curl flex gcc git libc6-dev libssl-dev openssl \
            python-is-python3 ssh wget zip zstd sudo make clang gcc-arm-linux-gnueabi software-properties-common \
            build-essential libarchive-tools gcc-aarch64-linux-gnu -y
          sudo apt install build-essential -y
          sudo apt install libssl-dev libffi-dev libncurses5-dev zlib1g zlib1g-dev libreadline-dev \
            libbz2-dev libsqlite3-dev make gcc -y
          sudo apt install pigz -y
          sudo apt install python3 -y
          sudo apt install cpio -y
          sudo apt install lld -y
          sudo apt install llvm -y
          sudo apt-get install g++-aarch64-linux-gnu -y
          sudo apt install libelf-dev -y

      - name: Download and extract AOSP Clang (r416183b)
        run: |
          mkdir -p "${{ env.TOOLCHAIN_DIR }}"
          echo "Downloading clang toolchain..."
          wget -qO clang.tar.gz "${{ env.CLANG_TARBALL_URL }}"
          tar -xzf clang.tar.gz -C "${{ env.TOOLCHAIN_DIR }}" --strip-components=1
          rm clang.tar.gz
          echo "Extracted clang to ${{ env.TOOLCHAIN_DIR }}"
          ls -lah "${{ env.TOOLCHAIN_DIR }}/bin" | head -n 20

      - name: Build kernel Image (force AOSP clang)
        run: |
          set -euo pipefail
          cd "${{ env.KERNEL_DIR }}"
          mkdir -p "${OUTDIR}"

          TOOLCHAIN_BIN="${{ env.TOOLCHAIN_DIR }}/bin"

          export ARCH=${{ env.ARCH }}
          export DEFCONFIG=${{ env.DEFCONFIG }}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="${TOOLCHAIN_BIN}/clang"
          export LD="${TOOLCHAIN_BIN}/ld.lld"
          export LLVM=1
          export LLVM_IAS=1

          echo "=== Checking AOSP Clang ==="
          echo "Clang path: $CC"
          "$CC" --version | head -n3
          echo "LD path: $LD"
          "$LD" --version | head -n3

          echo "=== Generating defconfig: $DEFCONFIG ==="
          make O="${OUTDIR}" ${DEFCONFIG}

          echo "=== Building kernel Image ==="
          make -C . O="${OUTDIR}" -j$(nproc --all) \
            ARCH=${ARCH} \
            CC="${CC}" \
            LD="${LD}" \
            LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            Image

          echo "=== Build done ==="
          ls -lh "${OUTDIR}/arch/arm64/boot/" || true

          mkdir -p "${{ github.workspace }}/release"
          cp "${OUTDIR}/arch/arm64/boot/Image" "${{ github.workspace }}/release/Image-${GITHUB_RUN_NUMBER}.img"

          echo "File saved to release/Image-${GITHUB_RUN_NUMBER}.img"

      - name: Create GitHub Release and upload Image
        uses: softprops/action-gh-release@v1
        with:
          name: "Kernel Image build #${{ github.run_number }}"
          tag_name: "kernel-${{ github.run_number }}"
          body: |
            ✅ build using **AOSP Clang r416183b**
            - **ARCH:** arm64
            - **DEFCONFIG:** mikasa_defconfig
            - **LOCALVERSION:** -mikasa
          files: release/*.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (for workflow UI)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: release/*.img
